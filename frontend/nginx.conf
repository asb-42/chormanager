# M5: static SPA + /api reverse proxy to the api service.
# NOTE: proxy_pass WITHOUT trailing slash keeps the /api prefix.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
